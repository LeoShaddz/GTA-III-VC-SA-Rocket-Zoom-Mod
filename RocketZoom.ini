[RocketZoom]
; Works with GTA III 1.0, Vice City 1.0, and San Andreas 1.0 US (same .asi file; the plugin detects the game automatically).
; 1 = enabled, 0 = disabled
Enable = 1

; Field of view (FOV) in degrees. 0 = uses each game's SNIPER values (III: 70..15, VC: 70..15, SA: 70..15).
; Change only if you want a different limit (e.g., MinFov = 8 for more zoom).
MinFov = 0
MaxFov = 0

; 1 = the more you zoom in, the slower the aiming sensitivity (same as the sniper rifle). 0 = fixed sensitivity (same as without zoom).
ScaleSensitivity = 1

; Zoom speed (1.0 = same speed as each game's sniper rifle).
Speed = 1.0

; ---------------- GTA San Andreas only ----------------
; (in III and VC, zoom uses the same buttons/wheel configured for the game's sniper zoom)
MouseWheel = 1
PadButtons = 1
; 1 = also applies to the Heat-Seeker
HeatSeeker = 1

; 1 = generates RocketZoom.log next to the .asi file (diagnostics)
Log = 0