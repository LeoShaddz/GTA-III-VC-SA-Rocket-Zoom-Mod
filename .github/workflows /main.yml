name: Build SaveTools
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compilar
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse -Filter SaveTools.cpp | Select-Object -First 1
          $ini = Get-ChildItem -Recurse -Filter SaveTools.ini | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path out | Out-Null
          cl /nologo /LD /O2 /MT /EHsc /D_CRT_SECURE_NO_WARNINGS $src.FullName /Fe:out\SaveTools.asi /Fo:out\ /link shell32.lib user32.lib
          Remove-Item out\*.obj, out\*.lib, out\*.exp -ErrorAction SilentlyContinue
          Copy-Item $ini.FullName out\
      - uses: actions/upload-artifact@v4
        with:
          name: SaveTools
          path: out/
